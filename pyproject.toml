[tool.poetry]
name = "voice-recognition-service"
version = "0.1.0"
description = "Telegram voice transcription service using DDD/CQRS and FastAPI"
authors = ["mashinaterrora"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.112.0"
uvicorn = {extras = ["standard"], version = "^0.30.5"}
pydantic-settings = "^2.4.0"
httpx = "^0.27.0"
punq = "^0.7.0"
orjson = "^3.10.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
