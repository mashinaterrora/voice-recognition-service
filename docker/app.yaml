version: "3.10"

services:
  main-app:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: main-app

    ports:
      - "${API_PORT}:8000"
    command: "uvicorn --factory app.application.api.entrypoint:create_app --timeout-graceful-shutdown 3 --reload --host 0.0.0.0 --port 8000"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ..:/app/
    networks:
      - backend

networks:
  backend:
    driver: bridge
